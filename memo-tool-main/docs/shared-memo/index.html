<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="個人でも共有でも使える軽量メモアプリ"><title>Shared Memo V3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="app-header"><a class="brand" href="./">Shared Memo</a><div id="user-panel" class="user-panel" hidden><button id="mobile-menu-button" class="button quiet mobile-only" type="button" aria-controls="side-nav" aria-expanded="false">メニュー</button><div><strong id="user-name"></strong><span id="user-email"></span></div><button id="logout-button" class="button quiet" type="button">ログアウト</button></div></header>
<main class="page-shell">
  <div id="message" class="message" role="alert" aria-live="assertive" hidden></div>
  <section id="login-view" class="center-card"><h1>共有メモへようこそ</h1><p>グループのメモを見るにはログインしてください。</p><button id="login-button" class="button" type="button">Googleでログイン</button></section>
  <section id="memo-view" hidden>
    <div class="workspace">
      <aside id="side-nav" class="side-nav">
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="検索..." aria-label="メモを検索"><button id="search-clear" class="search-clear" type="button" aria-label="検索をクリア" title="検索をクリア" hidden>×</button></div>
        <div class="nav-heading"><button data-view="all" class="nav-section active">フォルダ</button><button id="add-folder-button" class="icon-small" title="フォルダ作成">＋</button></div><button data-view="folder" data-folder-id="none">未分類</button><div id="folder-list"></div>
        <div class="nav-heading"><strong>タグ</strong></div><div id="tag-list" class="tag-list"></div><button id="show-all-tags" class="show-all-tags" type="button" hidden>すべて表示</button>
        <button data-view="trash">ゴミ箱</button><button id="settings-button">設定</button>
      </aside><div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-label="サイドバーの幅を調整" aria-orientation="vertical" tabindex="0"></div>
      <div class="content">
        <div id="bulk-actions" class="bulk-actions" hidden><strong id="selection-count"></strong><button id="bulk-move" class="button quiet" type="button">フォルダー移動</button><button id="bulk-trash" class="button danger" type="button">ゴミ箱に送る</button><button id="bulk-download" class="button quiet" type="button">ローカルに保存する</button><button id="bulk-cancel" class="text-button" type="button">キャンセル</button></div>
        <p id="active-filter" class="active-filter" hidden></p><p id="loading" class="status">メモを読み込んでいます…</p><p id="empty-state" class="empty-state" hidden>表示するメモはありません。</p><div id="memo-list" class="memo-list" aria-label="メモ一覧"></div>
      </div>
    </div>
    <button id="add-button" class="add-button" type="button" aria-label="新規メモを作成" title="新規メモを作成">＋</button>
  </section>
</main>
<div id="menu-overlay" class="menu-overlay" aria-hidden="true" hidden></div>
<dialog id="memo-dialog" class="editor-dialog"><form id="memo-form" method="dialog">
  <p class="editor-title">メモ編集中</p>
  <div class="editor-location" aria-label="保存先と拡張子"><span>メモ</span><span aria-hidden="true">›</span><select id="editor-folder" aria-label="フォルダ"></select><select id="editor-format" aria-label="拡張子"><option value="md">.md</option><option value="txt">.txt</option></select></div>
  <button id="close-button" class="editor-close" type="button" aria-label="エディターを閉じる">閉じる</button>
  <label class="sr-only" for="memo-editor">メモ（1行目はタイトル、最終行はタグ）</label>
  <textarea id="memo-editor" rows="18" maxlength="50000" placeholder="タイトルを入力してください…&#10;&#10;本文を入力&#10;&#10;#タグ"></textarea>
  <div id="tag-suggestions" class="tag-suggestions" role="listbox" aria-label="タグ候補" hidden></div>
</form></dialog>
<dialog id="viewer-dialog" class="viewer-dialog"><article class="viewer-panel"><div class="viewer-heading"><div><nav id="viewer-breadcrumb" class="viewer-breadcrumb" aria-label="メモの場所"></nav><div class="viewer-heading-title"><h2 id="viewer-title"></h2></div></div><div class="viewer-heading-actions"><button id="viewer-copy" class="text-button" type="button">コピー</button><button id="viewer-edit" class="text-button" type="button">編集</button><button id="viewer-close-icon" class="icon-button" type="button" aria-label="閉じる">×</button></div></div><div class="viewer-location-editor"><label>フォルダ<select id="viewer-folder"></select></label><label>拡張子<select id="viewer-format"><option value="md">.md</option><option value="txt">.txt</option></select></label></div><div id="viewer-body" class="viewer-body"></div><div id="viewer-meta" class="viewer-meta"></div></article></dialog>
<dialog id="folder-dialog" class="small-dialog"><form id="folder-form" class="panel"><div class="dialog-heading"><h2 id="folder-dialog-title">フォルダ作成</h2><button class="icon-button dialog-close" type="button">×</button></div><label>フォルダ名<input id="folder-name" maxlength="60" required></label><fieldset class="folder-color-field"><legend>フォルダの色</legend><div id="folder-colors" class="folder-colors"></div></fieldset><div class="dialog-actions"><button id="folder-delete-button" class="button danger" type="button" hidden>削除</button><span></span><button class="button" type="submit">保存</button></div></form></dialog>
<dialog id="all-tags-dialog" class="small-dialog"><div class="panel"><div class="dialog-heading"><div><p class="eyebrow">タグ</p><h2>すべてのタグ</h2></div><button class="icon-button dialog-close" type="button" aria-label="閉じる">×</button></div><p class="hint">使用数の多い順に表示しています。</p><div id="all-tag-list" class="tag-list all-tag-list"></div></div></dialog>
<dialog id="memo-settings-dialog" class="small-dialog"><form id="memo-settings-form" class="panel"><div class="dialog-heading"><div><p class="eyebrow">メモ設定</p><h2 id="memo-settings-title"></h2></div><button class="icon-button dialog-close" type="button" aria-label="閉じる">×</button></div><label>拡張子<select id="memo-format"><option value="md">Markdown (.md)</option><option value="txt">Text (.txt)</option></select></label><label>フォルダ<select id="memo-folder"></select></label><p class="hint">一覧の拡張子、または行末の「⋯」からこの設定ページを開けます。</p><div class="dialog-actions"><span></span><button class="button" type="submit">保存</button></div></form></dialog>
<dialog id="bulk-move-dialog" class="small-dialog"><form id="bulk-move-form" class="panel"><div class="dialog-heading"><div><p class="eyebrow">フォルダー移動</p><h2>移動先を選択</h2></div><button class="icon-button dialog-close" type="button" aria-label="閉じる">×</button></div><label for="bulk-move-folder">フォルダー</label><select id="bulk-move-folder"></select><p id="bulk-move-count" class="hint"></p><div class="dialog-actions"><span></span><button class="button" type="submit">OK</button></div></form></dialog>
<dialog id="tag-settings-dialog" class="small-dialog"><form id="tag-settings-form" class="panel"><div class="dialog-heading"><div><p class="eyebrow">タグ設定</p><h2 id="tag-settings-title"></h2></div><button class="icon-button dialog-close" type="button" aria-label="閉じる">×</button></div><fieldset class="tag-choice-field"><legend>既存のタグから選択</legend><div id="tag-settings-options" class="tag-settings-options"></div><p id="tag-settings-empty" class="hint" hidden>既存のタグはありません。</p></fieldset><label for="tag-settings-new">新しいタグ</label><div class="tag-new-row"><input id="tag-settings-new" type="text" maxlength="60" placeholder="タグ名を入力（#は不要）"><button id="tag-settings-add" class="button quiet" type="button">追加</button></div><p class="hint">最大20個まで設定できます。</p><div class="dialog-actions"><span></span><button class="button" type="submit">保存</button></div></form></dialog>
<dialog id="settings-dialog" class="small-dialog"><div class="panel"><div class="dialog-heading"><h2>設定</h2><button class="icon-button dialog-close">×</button></div><p>テーマカラー</p><div id="theme-options" class="theme-options"><button data-theme="blue" style="--swatch:#2563eb">Blue</button><button data-theme="green" style="--swatch:#16835d">Green</button><button data-theme="purple" style="--swatch:#7c3aed">Purple</button><button data-theme="orange" style="--swatch:#d65a0b">Orange</button><button data-theme="red" style="--swatch:#c33131">Red</button><button data-theme="gray" style="--swatch:#52606d">Gray</button></div></div></dialog>
<script type="module" src="./app.js"></script>
</body></html>
